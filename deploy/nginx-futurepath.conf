# ==============================================================
#  Nginx 配置（上线时前端页面 + 接口转发都靠它）
#
#  用法：宝塔 → 网站 → 新建站点（PHP 版本选"纯静态"）
#        → 站点设置 → 配置文件，把下面 server { } 里的内容替换进去
#
#  为什么用 8080 而不是 80：
#    大陆机房用【域名】走 80/443 端口必须先做 ICP 备案。
#    课程演示用"公网IP:8080"直接访问，不用备案就能看。
#    以后备好案了，把 listen 8080 改成 listen 80，再绑域名即可。
# ==============================================================

server {
    listen 8080;
    server_name _;                      # 没有域名时就这样写，有域名再换成域名

    # 前端打包产物（本地 npm run build 生成的 dist 目录）放这里
    root /www/wwwroot/futurepath/dist;
    index index.html;

    # ---------- 基本压缩：前端打包后 1MB 左右，压缩能省一半流量 ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---------- 接口：/api 开头的请求转给后端 ----------
    #
    #  前端代码里所有请求都发 /api/xxx（同源），所以浏览器根本不认为
    #  跨域，CORS 那套问题在上线后自然就没了 —— 不用改前端任何一个字。
    location /api/ {
        proxy_pass http://127.0.0.1:5000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 问答要等模型，别在 Nginx 这一层先超时
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }

    # ---------- 页面 ----------
    #
    #  我们用的是 hash 路由（地址带 #），理论上不需要下面这行"回退"，
    #  留着是防以后有人改成 history 路由时页面 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 顺手挡掉几个常见扫描 ----------
    location ~ /\.(env|git) {
        deny all;
    }

    access_log /www/wwwlogs/futurepath.access.log;
    error_log  /www/wwwlogs/futurepath.error.log;
}
